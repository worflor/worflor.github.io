name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKIP_WHISPER_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 for the global WebSocket that render-resume-pdf.mjs drives the
          # browser with; 20 is also past end-of-life
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # /resume.pdf is rendered from the built /resume page at deploy time so
      # it can never drift from the site; the runner image ships chrome.
      - run: node scripts/render-resume-pdf.mjs
      - run: node --test tests/resume-page.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
